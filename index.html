<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Мастер</title>
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
            color: #333; 
            padding-bottom: 70px;
            min-height: 100vh;
        }
        .header { 
            background: linear-gradient(135deg, #0077FF 0%, #005ce6 100%); 
            color: white; 
            padding: 20px 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header-subtitle {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: normal;
        }
        .container { 
            padding: 15px; 
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h3 { 
            margin: 0 0 15px 0; 
            font-size: 16px;
            color: #333;
        }
        .btn { 
            background: #0077FF; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn:active { 
            background: #005ce6;
            transform: scale(0.98);
        }
        .btn:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0077FF;
        }
        .nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: white; 
            display: flex; 
            border-top: 1px solid #eee;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }
        .nav-item { 
            flex: 1; 
            text-align: center; 
            padding: 12px 0; 
            font-size: 12px; 
            color: #888; 
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-item.active { 
            color: #0077FF; 
            font-weight: bold;
        }
        .nav-icon { 
            font-size: 22px; 
            display: block; 
            margin-bottom: 4px;
        }
        .tab { 
            display: none;
            animation: fadeIn 0.3s;
        }
        .tab.active { 
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading { 
            text-align: center; 
            color: #888; 
            padding: 30px 20px;
            font-size: 15px;
        }
        .order-item { 
            border-bottom: 1px solid #eee; 
            padding-bottom: 12px; 
            margin-bottom: 12px;
        }
        .order-item:last-child { 
            border-bottom: none; 
            margin-bottom: 0;
        }
        .badge { 
            display: inline-block; 
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); 
            color: #0077FF; 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 14px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0077FF 0%, #005ce6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
        }
        .profile-info div {
            margin-bottom: 8px;
            font-size: 15px;
        }
        .profile-label {
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header">
        🛠 Мой Мастер
        <div class="header-subtitle">Поиск проверенных мастеров</div>
    </div>

    <!-- Вкладка: Главная -->
    <div id="tab-home" class="tab active">
        <div class="container">
            <div class="card">
                <h3>📋 Категории услуг</h3>
                <div id="categories-list" class="loading">Загрузка...</div>
            </div>
            <div class="card">
                <h3>🔥 Последние заявки</h3>
                <div id="orders-list" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Вкладка: Новая заявка -->
    <div id="tab-order" class="tab">
        <div class="container">
            <div class="card">
                <h3>📝 Новая заявка</h3>
                <select id="order-category">
                    <option value="">Выберите категорию</option>
                </select>
                <input type="text" id="order-title" placeholder="Заголовок (например: Починить розетку)">
                <textarea id="order-description" rows="4" placeholder="Описание проблемы..."></textarea>
                <input type="number" id="order-budget" placeholder="Бюджет (руб)">
                <button class="btn" onclick="createOrder()"> Создать заявку</button>
            </div>
        </div>
    </div>

    <!-- Вкладка: Профиль -->
    <div id="tab-profile" class="tab">
        <div class="container">
            <div class="card">
                <h3>👤 Профиль</h3>
                <div id="profile-info" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon"></span>Главная
        </div>
        <div class="nav-item" onclick="switchTab('order')">
            <span class="nav-icon">➕</span>Заявка
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span>Профиль
        </div>
    </div>

    <script>
        // ============================================
        // 1. ИНИЦИАЛИЗАЦИЯ SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://kmjuddmhvlccrbyyfcce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttanVkZG1odmxjY3JieXlmY2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2Mjc5ODcsImV4cCI6MjEwMjIwMzk4N30.PhJxMFSRlF9tmUuvOLH-JC9Tn-9kAgQ11XEg69eJZ6c';
        
        // ВАЖНО: используем supabaseClient вместо supabase!
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;

        // ============================================
        // 2. ИНИЦИАЛИЗАЦИЯ VK BRIDGE
        // ============================================
        console.log('🚀 Приложение запускается...');
        console.log('Supabase URL:', SUPABASE_URL);
        console.log('Supabase Client:', supabaseClient);

        vkBridge.send('VKWebAppInit').then(() => {
            console.log('✅ VK Bridge инициализирован');
            loadUserData();
        }).catch(err => {
            console.error('❌ Ошибка VK Bridge:', err);
            // Для тестирования в обычном браузере
            console.log('🧪 Тестовый режим (без VK)');
            currentUser = { 
                id: 1, 
                vk_id: 999999, 
                name: 'Тестовый Пользователь', 
                role: 'customer' 
            };
            updateProfileUI();
            loadCategories();
            loadOrders();
        });

        // ============================================
        // 3. ПОЛУЧЕНИЕ ДАННЫХ ПОЛЬЗОВАТЕЛЯ
        // ============================================
        async function loadUserData() {
            try {
                console.log('📥 Получение данных пользователя из VK...');
                const userData = await vkBridge.send('VKWebAppGetUserInfo');
                const vkId = userData.id;
                const name = `${userData.first_name} ${userData.last_name}`.trim();

                console.log('👤 Пользователь VK:', vkId, name);

                // Проверяем или создаем пользователя в Supabase
                let { data: users, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('vk_id', vkId)
                    .single();

                if (error && error.code !== 'PGRST116') {
                    console.error('Ошибка при поиске пользователя:', error);
                }

                if (!users) {
                    console.log('📝 Создаем нового пользователя...');
                    const { data: newUser, error: insertError } = await supabaseClient
                        .from('users')
                        .insert([{ 
                            vk_id: vkId, 
                            name: name, 
                            role: 'customer',
                            rating: 0,
                            reviews_count: 0
                        }])
                        .select()
                        .single();
                    
                    if (insertError) {
                        console.error('Ошибка при создании пользователя:', insertError);
                    } else {
                        currentUser = newUser;
                        console.log('✅ Пользователь создан:', currentUser);
                    }
                } else {
                    currentUser = users;
                    console.log('✅ Пользователь найден:', currentUser);
                }
                
                updateProfileUI();
                loadCategories();
                loadOrders();
            } catch (e) {
                console.error('❌ Ошибка получения данных VK:', e);
            }
        }

        // ============================================
        // 4. ЗАГРУЗКА КАТЕГОРИЙ
        // ============================================
        async function loadCategories() {
            console.log('📂 Загрузка категорий...');
            
            const { data, error } = await supabaseClient
                .from('categories')
                .select('*')
                .order('sort_order', { ascending: true });

            const container = document.getElementById('categories-list');
            const select = document.getElementById('order-category');
            
            if (error) {
                console.error('Ошибка загрузки категорий:', error);
                container.innerHTML = '<div class="error">Ошибка: ' + error.message + '</div>';
                return;
            }

            if (!data || data.length === 0) {
                console.log('⚠️ Категории пусты');
                container.innerHTML = '<div class="loading">Категории пока пусты</div>';
                return;
            }

            console.log('✅ Категории загружены:', data);

            // Отображаем на главной
            container.innerHTML = data.map(c => 
                `<span class="badge">${c.name}</span>`
            ).join(' ');
            
            // Заполняем селект в форме
            select.innerHTML = '<option value="">Выберите категорию</option>' + 
                data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        // ============================================
        // 5. ЗАГРУЗКА ЗАЯВОК
        // ============================================
        async function loadOrders() {
            console.log(' Загрузка заявок...');
            
            const { data, error } = await supabaseClient
                .from('orders')
                .select(`
                    *,
                    categories (name),
                    users (name)
                `)
                .eq('status', 'open')
                .order('created_at', { ascending: false })
                .limit(10);

            const container = document.getElementById('orders-list');
            
            if (error) {
                console.error('Ошибка загрузки заявок:', error);
                container.innerHTML = '<div class="error">Ошибка: ' + error.message + '</div>';
                return;
            }

            if (!data || data.length === 0) {
                console.log('⚠️ Заявок пока нет');
                container.innerHTML = '<div class="loading">Пока нет активных заявок</div>';
                return;
            }

            console.log('✅ Заявки загружены:', data);

            container.innerHTML = data.map(order => `
                <div class="order-item">
                    <span class="badge">${order.categories?.name || 'Без категории'}</span>
                    <div style="font-weight:bold; margin-bottom:5px; font-size:16px;">${order.title}</div>
                    <div style="font-size:14px; color:#666; margin-bottom:8px;">${order.description || 'Нет описания'}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:14px;">
                        <span style="color:#888;">${order.users?.name || 'Аноним'}</span>
                        <span style="font-weight:bold; color:#0077FF; font-size:16px;">
                            ${order.budget ? order.budget + ' ₽' : 'Договорная'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // 6. СОЗДАНИЕ ЗАЯВКИ
        // ============================================
        async function createOrder() {
            if (!currentUser) {
                alert('Пожалуйста, подождите загрузку профиля');
                return;
            }
            
            const categoryId = document.getElementById('order-category').value;
            const title = document.getElementById('order-title').value.trim();
            const description = document.getElementById('order-description').value.trim();
            const budget = document.getElementById('order-budget').value;

            if (!categoryId) {
                alert('Пожалуйста, выберите категорию');
                return;
            }
            if (!title) {
                alert('Пожалуйста, введите заголовок');
                return;
            }

            const btn = document.querySelector('#tab-order .btn');
            const originalText = btn.textContent;
            btn.textContent = '⏳ Создание...';
            btn.disabled = true;

            console.log('📤 Создание заявки:', { categoryId, title, description, budget });

            const { data, error } = await supabaseClient
                .from('orders')
                .insert([{ 
                    user_id: currentUser.id, 
                    category_id: parseInt(categoryId), 
                    title: title, 
                    description: description || null, 
                    budget: budget ? parseFloat(budget) : null,
                    status: 'open'
                }])
                .select();

            if (error) {
                console.error('Ошибка при создании заявки:', error);
                alert('❌ Ошибка: ' + error.message);
            } else {
                console.log('✅ Заявка создана:', data);
                alert('✅ Заявка успешно создана!');
                
                // Очищаем форму
                document.getElementById('order-title').value = '';
                document.getElementById('order-description').value = '';
                document.getElementById('order-budget').value = '';
                document.getElementById('order-category').value = '';
                
                // Переключаемся на главную и обновляем
                switchTabHome();
                loadOrders();
            }
            
            btn.textContent = originalText;
            btn.disabled = false;
        }

        // ============================================
        // 7. ОБНОВЛЕНИЕ ПРОФИЛЯ
        // ============================================
        function updateProfileUI() {
            if (!currentUser) {
                document.getElementById('profile-info').innerHTML = 
                    '<div class="error">Ошибка загрузки профиля</div>';
                return;
            }

            const firstLetter = currentUser.name.charAt(0).toUpperCase();
            
            document.getElementById('profile-info').innerHTML = `
                <div class="profile-avatar">${firstLetter}</div>
                <div class="profile-info">
                    <div style="font-size:20px; font-weight:bold; margin-bottom:15px; text-align:center;">
                        ${currentUser.name}
                    </div>
                    <div style="background:#f5f5f5; padding:12px; border-radius:8px; margin-bottom:10px;">
                        <div class="profile-label">Роль</div>
                        <div style="font-weight:600; margin-top:4px;">
                            ${currentUser.role === 'customer' ? '👤 Заказчик' : '👷 Мастер'}
                        </div>
                    </div>
                    <div style="background:#f5f5f5; padding:12px; border-radius:8px; margin-bottom:10px;">
                        <div class="profile-label">VK ID</div>
                        <div style="font-weight:600; margin-top:4px;">${currentUser.vk_id}</div>
                    </div>
                    <div style="background:#f5f5f5; padding:12px; border-radius:8px;">
                        <div class="profile-label">Рейтинг</div>
                        <div style="font-weight:600; margin-top:4px;">
                            ${currentUser.rating || 0}  (${currentUser.reviews_count || 0} отзывов)
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================
        // 8. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ============================================
        function switchTab(tabName) {
            // Скрываем все вкладки
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Показываем нужную
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Обновляем навигацию
            const navItems = document.querySelectorAll('.nav-item');
            if (tabName === 'home') navItems[0].classList.add('active');
            else if (tabName === 'order') navItems[1].classList.add('active');
            else if (tabName === 'profile') navItems[2].classList.add('active');
        }

        function switchTabHome() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-home').classList.add('active');
            document.querySelectorAll('.nav-item')[0].classList.add('active');
        }

        // ============================================
        // 9. ТЕСТИРОВАНИЕ СОЕДИНЕНИЯ
        // ============================================
        async function testConnection() {
            console.log('🔌 Тестирование соединения с Supabase...');
            
            const { data, error } = await supabaseClient
                .from('categories')
                .select('*')
                .limit(1);
            
            if (error) {
                console.error('❌ Ошибка подключения:', error);
                return false;
            } else {
                console.log('✅ Подключение успешно!');
                return true;
            }
        }

        // Запускаем тест при загрузке
        setTimeout(() => {
            testConnection();
        }, 2000);
    </script>
</body>
</html>
