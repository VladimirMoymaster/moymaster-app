<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Мастер</title>
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif; margin: 0; padding: 0; background: #f5f5f5; color: #333; padding-bottom: 70px; }
        .header { background: #0077FF; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; position: sticky; top: 0; z-index: 10; }
        .container { padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; }
        .btn { background: #0077FF; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px; }
        .btn:active { background: #005ce6; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; font-size: 12px; color: #888; cursor: pointer; }
        .nav-item.active { color: #0077FF; font-weight: bold; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 4px; }
        .tab { display: none; }
        .tab.active { display: block; }
        .loading { text-align: center; color: #888; padding: 20px; }
        .order-item { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .order-item:last-child { border-bottom: none; margin-bottom: 0; }
        .badge { display: inline-block; background: #e3f2fd; color: #0077FF; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="header">🛠 Мой Мастер</div>

    <!-- Вкладка: Главная -->
    <div id="tab-home" class="tab active">
        <div class="container">
            <div class="card">
                <h3>📋 Категории услуг</h3>
                <div id="categories-list" class="loading">Загрузка...</div>
            </div>
            <div class="card">
                <h3>🔥 Последние заявки</h3>
                <div id="orders-list" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Вкладка: Новая заявка -->
    <div id="tab-order" class="tab">
        <div class="container">
            <div class="card">
                <h3>📝 Новая заявка</h3>
                <select id="order-category">
                    <option value="">Выберите категорию</option>
                </select>
                <input type="text" id="order-title" placeholder="Заголовок (например: Починить розетку)">
                <textarea id="order-description" rows="4" placeholder="Описание проблемы..."></textarea>
                <input type="number" id="order-budget" placeholder="Бюджет (руб)">
                <button class="btn" onclick="createOrder()">📤 Создать заявку</button>
            </div>
        </div>
    </div>

    <!-- Вкладка: Профиль -->
    <div id="tab-profile" class="tab">
        <div class="container">
            <div class="card">
                <h3>👤 Профиль</h3>
                <div id="profile-info" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>Главная
        </div>
        <div class="nav-item" onclick="switchTab('order')">
            <span class="nav-icon">➕</span>Заявка
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span class="nav-icon">👤</span>Профиль
        </div>
    </div>

    <script>
        // 1. ИНИЦИАЛИЗАЦИЯ SUPABASE (ЗАМЕНИ НА СВОИ ДАННЫЕ!)
        const SUPABASE_URL = 'https://kmjuddmhvlccrbyyfcce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttanVkZG1odmxjY3JieXlmY2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2Mjc5ODcsImV4cCI6MjEwMjIwMzk4N30.PhJxMFSRlF9tmUuvOLH-JC9Tn-9kAgQ11XEg69eJZ6c'; // вставь свой полный ключ
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        
        let currentUser = null;
        console.log(' SUPABASE_URL:', SUPABASE_URL);
        console.log('🔑 SUPABASE_KEY:', SUPABASE_KEY.substring(0, 20) + '...');
        console.log(' Supabase client:', supabase);

        // 2. ИНИЦИАЛИЗАЦИЯ VK BRIDGE
        vkBridge.send('VKWebAppInit').then(() => {
            console.log('VK Bridge инициализирован');
            loadUserData();
        }).catch(err => {
            console.error('Ошибка VK Bridge:', err);
            // Для тестирования в обычном браузере создаем фейкового пользователя
            currentUser = { id: 1, vk_id: 999999, name: 'Тестовый Пользователь', role: 'customer' };
            updateProfileUI();
            loadCategories();
            loadOrders();
        });

        // 3. ПОЛУЧЕНИЕ ДАННЫХ ПОЛЬЗОВАТЕЛЯ ИЗ VK
        async function loadUserData() {
            try {
                const userData = await vkBridge.send('VKWebAppGetUserInfo');
                const vkId = userData.id;
                const name = `${userData.first_name} ${userData.last_name}`.trim();

                // Проверяем или создаем пользователя в Supabase (аналог vk_auth)
                let { data: users, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('vk_id', vkId)
                    .single();

                if (!users) {
                    const { data: newUser, error: insertError } = await supabase
                        .from('users')
                        .insert([{ vk_id: vkId, name: name, role: 'customer' }])
                        .select()
                        .single();
                    currentUser = newUser;
                } else {
                    currentUser = users;
                }
                
                updateProfileUI();
                loadCategories();
                loadOrders();
            } catch (e) {
                console.error('Ошибка получения данных VK:', e);
            }
        }

        // 4. ЗАГРУЗКА КАТЕГОРИЙ
        async function loadCategories() {
            const { data, error } = await supabase
                .from('categories')
                .select('*')
                .order('sort_order', { ascending: true });

            const container = document.getElementById('categories-list');
            const select = document.getElementById('order-category');
            
            if (error || !data) {
                container.innerHTML = 'Ошибка загрузки';
                return;
            }

            // Отображаем на главной
            container.innerHTML = data.map(c => `<span class="badge">${c.name}</span>`).join(' ');
            
            // Заполняем селект в форме
            select.innerHTML = '<option value="">Выберите категорию</option>' + 
                data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        // 5. ЗАГРУЗКА ЗАЯВОК
        async function loadOrders() {
            // В реальном проекте тут можно сделать JOIN с users и categories
            const { data, error } = await supabase
                .from('orders')
                .select('*, categories(name)')
                .eq('status', 'open')
                .order('created_at', { ascending: false })
                .limit(5);

            const container = document.getElementById('orders-list');
            if (error || !data || data.length === 0) {
                container.innerHTML = '<div style="color:#888">Пока нет активных заявок</div>';
                return;
            }

            container.innerHTML = data.map(order => `
                <div class="order-item">
                    <div style="font-weight:bold; margin-bottom:5px;">${order.title}</div>
                    <div style="font-size:14px; color:#666; margin-bottom:5px;">${order.description}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="badge">${order.categories?.name || 'Без категории'}</span>
                        <span style="font-weight:bold; color:#0077FF;">${order.budget ? order.budget + ' ₽' : 'Договорная'}</span>
                    </div>
                </div>
            `).join('');
        }

        // 6. СОЗДАНИЕ ЗАЯВКИ
        async function createOrder() {
            if (!currentUser) return alert('Сначала дождитесь загрузки профиля');
            
            const categoryId = document.getElementById('order-category').value;
            const title = document.getElementById('order-title').value.trim();
            const description = document.getElementById('order-description').value.trim();
            const budget = document.getElementById('order-budget').value;

            if (!categoryId || !title) {
                return alert('Пожалуйста, заполните категорию и заголовок');
            }

            const btn = document.querySelector('#tab-order .btn');
            btn.textContent = 'Создание...';
            btn.disabled = true;

            const { data, error } = await supabase
                .from('orders')
                .insert([{ 
                    user_id: currentUser.id, 
                    category_id: categoryId, 
                    title, 
                    description, 
                    budget: budget || null,
                    status: 'open'
                }])
                .select();

            if (error) {
                alert('Ошибка при создании: ' + error.message);
            } else {
                alert('✅ Заявка успешно создана!');
                document.getElementById('order-title').value = '';
                document.getElementById('order-description').value = '';
                document.getElementById('order-budget').value = '';
                switchTab('home');
                loadOrders(); // Обновляем список
            }
            
            btn.textContent = '📤 Создать заявку';
            btn.disabled = false;
        }

        // 7. ОБНОВЛЕНИЕ ПРОФИЛЯ
        function updateProfileUI() {
            document.getElementById('profile-info').innerHTML = `
                <div style="font-size:18px; font-weight:bold; margin-bottom:10px;">${currentUser.name}</div>
                <div style="color:#666; margin-bottom:5px;">Роль: ${currentUser.role === 'customer' ? '👤 Заказчик' : '👷 Мастер'}</div>
                <div style="color:#666;">VK ID: ${currentUser.vk_id}</div>
            `;
        }

        // 8. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
