<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Мастер</title>
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f5f5f5; 
            color: #333; 
            padding-bottom: 70px;
        }
        .header { 
            background: linear-gradient(135deg, #0077FF 0%, #005ce6 100%); 
            color: white; 
            padding: 20px 15px; 
            text-align: center; 
            font-weight: bold; 
            font-size: 20px;
        }
        .container { padding: 15px; }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card h3 { margin: 0 0 15px 0; font-size: 16px; }
        .btn { 
            background: #0077FF; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { background: #005ce6; }
        .btn:disabled { background: #999; cursor: not-allowed; }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 15px;
            box-sizing: border-box;
        }
        .nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: white; 
            display: flex; 
            border-top: 1px solid #eee;
        }
        .nav-item { 
            flex: 1; 
            text-align: center; 
            padding: 12px 0; 
            font-size: 12px; 
            color: #888; 
            cursor: pointer;
        }
        .nav-item.active { color: #0077FF; font-weight: bold; }
        .nav-icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .tab { display: none; }
        .tab.active { display: block; }
        .loading { text-align: center; color: #888; padding: 30px 20px; }
        .error { 
            background: #ffebee; 
            color: #c62828; 
            padding: 12px; 
            border-radius: 8px; 
            margin: 10px 0;
        }
        .order-item { 
            border-bottom: 1px solid #eee; 
            padding-bottom: 12px; 
            margin-bottom: 12px;
        }
        .badge { 
            display: inline-block; 
            background: #e3f2fd; 
            color: #0077FF; 
            padding: 5px 10px; 
            border-radius: 6px; 
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0077FF 0%, #005ce6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>

    <div class="header">🛠 Мой Мастер</div>

    <!-- Вкладка: Главная -->
    <div id="tab-home" class="tab active">
        <div class="container">
            <div class="card">
                <h3>📋 Категории услуг</h3>
                <div id="categories-list" class="loading">Загрузка...</div>
            </div>
            <div class="card">
                <h3>🔥 Последние заявки</h3>
                <div id="orders-list" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Вкладка: Новая заявка -->
    <div id="tab-order" class="tab">
        <div class="container">
            <div class="card">
                <h3>📝 Новая заявка</h3>
                <select id="order-category">
                    <option value="">Выберите категорию</option>
                </select>
                <input type="text" id="order-title" placeholder="Заголовок (например: Починить розетку)">
                <textarea id="order-description" rows="4" placeholder="Описание проблемы..."></textarea>
                <input type="number" id="order-budget" placeholder="Бюджет (руб)">
                <button class="btn" onclick="createOrder()">📤 Создать заявку</button>
            </div>
        </div>
    </div>

    <!-- Вкладка: Профиль -->
    <div id="tab-profile" class="tab">
        <div class="container">
            <div class="card">
                <h3>👤 Профиль</h3>
                <div id="profile-info" class="loading">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <span class="nav-icon">🏠</span>Главная
        </div>
        <div class="nav-item" onclick="switchTab('order')">
            <span class="nav-icon">➕</span>Заявка
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <span class="nav-icon"></span>Профиль
        </div>
    </div>

    <script>
        // ============================================
        // 1. ИНИЦИАЛИЗАЦИЯ SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://kmjuddmhvlccrbyyfcce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttanVkZG1odmxjY3JieXlmY2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2Mjc5ODcsImV4cCI6MjEwMjIwMzk4N30.PhJxMFSRlF9tmUuvOLH-JC9Tn-9kAgQ11XEg69eJZ6c';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUser = null;

        console.log('🚀 Приложение запускается...');

        // ============================================
        // 2. ИНИЦИАЛИЗАЦИЯ
        // ============================================
        async function initApp() {
            try {
                // Пробуем получить данные из VK
                await vkBridge.send('VKWebAppInit');
                console.log('✅ VK Bridge инициализирован');
                
                const userData = await vkBridge.send('VKWebAppGetUserInfo');
                await loadOrCreateUser(userData.id, `${userData.first_name} ${userData.last_name}`.trim());
                
            } catch (err) {
                console.log('⚠️ VK Bridge не доступен (тестовый режим):', err.message);
                // Тестовый пользователь для браузера
                await loadOrCreateUser(999999, 'Тестовый Пользователь');
            }
        }

        // ============================================
        // 3. ЗАГРУЗКА ИЛИ СОЗДАНИЕ ПОЛЬЗОВАТЕЛЯ
        // ============================================
        async function loadOrCreateUser(vkId, name) {
            console.log('👤 Загрузка пользователя:', vkId, name);
            
            try {
                // Ищем пользователя
                let { data: users, error: selectError } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('vk_id', vkId)
                    .single();

                if (selectError && selectError.code !== 'PGRST116') {
                    console.error('❌ Ошибка поиска пользователя:', selectError);
                }

                // Если не найден - создаем
                if (!users) {
                    console.log('📝 Создаем нового пользователя...');
                    const { data: newUser, error: insertError } = await supabaseClient
                        .from('users')
                        .insert([{ 
                            vk_id: vkId, 
                            name: name, 
                            role: 'customer'
                        }])
                        .select()
                        .single();
                    
                    if (insertError) {
                        console.error('❌ Ошибка создания пользователя:', insertError);
                        showProfileError('Ошибка создания профиля');
                        return;
                    }
                    
                    currentUser = newUser;
                    console.log('✅ Пользователь создан:', currentUser);
                } else {
                    currentUser = users;
                    console.log('✅ Пользователь найден:', currentUser);
                }

                updateProfileUI();
                
                // Загружаем данные
                await loadCategories();
                await loadOrders();

            } catch (err) {
                console.error('❌ Ошибка работы с пользователем:', err);
                showProfileError('Ошибка: ' + err.message);
            }
        }

        // ============================================
        // 4. ЗАГРУЗКА КАТЕГОРИЙ
        // ============================================
        async function loadCategories() {
            console.log('📂 Загрузка категорий...');
            
            const { data, error } = await supabaseClient
                .from('categories')
                .select('*')
                .order('sort_order', { ascending: true });

            const container = document.getElementById('categories-list');
            const select = document.getElementById('order-category');
            
            if (error) {
                console.error('❌ Ошибка загрузки категорий:', error);
                container.innerHTML = `<div class="error">Ошибка: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                console.log('⚠️ Категории пусты');
                container.innerHTML = '<div class="loading">Категории пусты. Добавьте в Supabase!</div>';
                return;
            }

            console.log(`✅ Загружено категорий: ${data.length}`);

            // Отображаем на главной
            container.innerHTML = data.map(c => 
                `<span class="badge">${c.name}</span>`
            ).join(' ');
            
            // Заполняем селект
            select.innerHTML = '<option value="">Выберите категорию</option>' + 
                data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        // ============================================
        // 5. ЗАГРУЗКА ЗАЯВОК
        // ============================================
        async function loadOrders() {
            console.log('📋 Загрузка заявок...');
            
            const { data, error } = await supabaseClient
                .from('orders')
                .select(`
                    *,
                    categories (name),
                    users (name)
                `)
                .eq('status', 'open')
                .order('created_at', { ascending: false })
                .limit(10);

            const container = document.getElementById('orders-list');
            
            if (error) {
                console.error('❌ Ошибка загрузки заявок:', error);
                container.innerHTML = `<div class="error">Ошибка: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                console.log('️ Заявок пока нет');
                container.innerHTML = '<div class="loading">Пока нет активных заявок.<br>Будь первым!</div>';
                return;
            }

            console.log(`✅ Загружено заявок: ${data.length}`);

            container.innerHTML = data.map(order => `
                <div class="order-item">
                    <span class="badge">${order.categories?.name || 'Без категории'}</span>
                    <div style="font-weight:bold; margin-bottom:5px;">${order.title}</div>
                    <div style="font-size:14px; color:#666; margin-bottom:8px;">${order.description || 'Нет описания'}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#888;">${order.users?.name || 'Аноним'}</span>
                        <span style="font-weight:bold; color:#0077FF;">
                            ${order.budget ? order.budget + ' ₽' : 'Договорная'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // 6. СОЗДАНИЕ ЗАЯВКИ
        // ============================================
        async function createOrder() {
            if (!currentUser) {
                alert('Подождите загрузку профиля');
                return;
            }
            
            const categoryId = document.getElementById('order-category').value;
            const title = document.getElementById('order-title').value.trim();
            const description = document.getElementById('order-description').value.trim();
            const budget = document.getElementById('order-budget').value;

            if (!categoryId) {
                alert('Выберите категорию');
                return;
            }
            if (!title) {
                alert('Введите заголовок');
                return;
            }

            const btn = document.querySelector('#tab-order .btn');
            btn.textContent = '⏳ Создание...';
            btn.disabled = true;

            console.log('📤 Создание заявки...', { categoryId, title, budget });

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .insert([{ 
                        user_id: currentUser.id, 
                        category_id: parseInt(categoryId), 
                        title: title, 
                        description: description || null, 
                        budget: budget ? parseFloat(budget) : null,
                        status: 'open'
                    }])
                    .select();

                if (error) {
                    console.error('❌ Ошибка создания заявки:', error);
                    alert('Ошибка: ' + error.message);
                } else {
                    console.log('✅ Заявка создана:', data);
                    alert('✅ Заявка успешно создана!');
                    
                    // Очищаем форму
                    document.getElementById('order-title').value = '';
                    document.getElementById('order-description').value = '';
                    document.getElementById('order-budget').value = '';
                    document.getElementById('order-category').value = '';
                    
                    // Обновляем список
                    await loadOrders();
                    switchTab('home');
                }
            } catch (err) {
                console.error('❌ Ошибка:', err);
                alert('Ошибка при создании: ' + err.message);
            }
            
            btn.textContent = ' Создать заявку';
            btn.disabled = false;
        }

        // ============================================
        // 7. ОБНОВЛЕНИЕ ПРОФИЛЯ
        // ============================================
        function updateProfileUI() {
            if (!currentUser) {
                showProfileError('Пользователь не загружен');
                return;
            }

            const firstLetter = currentUser.name.charAt(0).toUpperCase();
            
            document.getElementById('profile-info').innerHTML = `
                <div class="profile-avatar">${firstLetter}</div>
                <div style="text-align:center;">
                    <div style="font-size:20px; font-weight:bold; margin-bottom:15px;">
                        ${currentUser.name}
                    </div>
                    <div style="background:#f5f5f5; padding:12px; border-radius:8px; margin-bottom:10px;">
                        <div style="color:#888; font-size:13px;">Роль</div>
                        <div style="font-weight:600; margin-top:4px;">
                            ${currentUser.role === 'customer' ? '👤 Заказчик' : '👷 Мастер'}
                        </div>
                    </div>
                    <div style="background:#f5f5f5; padding:12px; border-radius:8px; margin-bottom:10px;">
                        <div style="color:#888; font-size:13px;">VK ID</div>
                        <div style="font-weight:600; margin-top:4px;">${currentUser.vk_id}</div>
                    </div>
                </div>
            `;
        }

        function showProfileError(message) {
            document.getElementById('profile-info').innerHTML = 
                `<div class="error">️ ${message}</div>`;
        }

        // ============================================
        // 8. ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
        // ============================================
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            const navItems = document.querySelectorAll('.nav-item');
            if (tabName === 'home') navItems[0].classList.add('active');
            else if (tabName === 'order') navItems[1].classList.add('active');
            else if (tabName === 'profile') navItems[2].classList.add('active');
        }

        // ============================================
        // ЗАПУСК ПРИЛОЖЕНИЯ
        // ============================================
        initApp();
    </script>
</body>
</html>
